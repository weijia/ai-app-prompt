<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDN 降级图表示例</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#fff; --text:#1f2328; --muted:#6b7280;
    --border:#e5e7eb; --primary:#2563eb;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#111827; --surface:#1f2937; --text:#f3f4f6; --muted:#9ca3af; --border:#374151; }
  }
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:var(--bg);color:var(--text);
       font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:760px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
  #banner{display:none;margin-bottom:16px;padding:12px 16px;border-radius:10px;
          background:#fffbeb;color:#92400e;font-size:14px;border:1px solid #fde68a;}
  #chart{width:100%;height:320px}
  /* 降级用的纯 CSS 条形图 */
  .fallback-bar{margin-bottom:12px}
  .fallback-bar .label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
  .track{height:14px;background:var(--border);border-radius:999px;overflow:hidden}
  .fill{height:100%;background:var(--primary);border-radius:999px;transition:width .3s ease}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left}
</style>
</head>
<body>
<div class="card">
  <h1>近 6 个月支出</h1>
  <p class="sub">演示：ECharts 主源加载失败时，自动降级为原生表格 + 纯 CSS 条形图</p>
  <div id="banner">图表库加载失败，已切换为表格视图（不影响数据查看）。</div>
  <div id="chart"></div>
  <div id="fallback" style="display:none"></div>
</div>

<!-- 主源：Staticfile（国内稳定）；版本号写死，禁止 latest -->
<script src="https://cdn.staticfile.org/echarts/5.5.0/echarts.min.js" onerror="loadBackup()"></script>
<script>
  // 备用源：360 baomitu。仍然失败则进入降级分支。
  function loadBackup(){
    var s = document.createElement('script');
    s.src = 'https://lib.baomitu.com/echarts/5.5.0/echarts.min.js';
    s.onerror = function(){ window.__chartLibFailed = true; render(); };
    s.onload = function(){ render(); };
    document.head.appendChild(s);
  }

  var DATA = [
    { month:'1月', value:3200 }, { month:'2月', value:2800 }, { month:'3月', value:4100 },
    { month:'4月', value:3600 }, { month:'5月', value:2900 }, { month:'6月', value:4700 }
  ];
  var MAX = Math.max.apply(null, DATA.map(function(d){ return d.value; }));
  var chart;

  // 降级视图：表格 + CSS 条形图
  function renderFallback(){
    document.getElementById('banner').style.display = 'block';
    document.getElementById('chart').style.display = 'none';
    var box = document.getElementById('fallback');
    box.style.display = 'block';
    var html = '';
    DATA.forEach(function(d){
      html += '<div class="fallback-bar"><div class="label"><span>'+d.month+
              '</span><span>¥'+d.value.toLocaleString('zh-CN')+'</span></div>'+
              '<div class="track"><div class="fill" style="width:'+(d.value/MAX*100)+'%"></div></div></div>';
    });
    html += '<table><thead><tr><th>月份</th><th>支出（元）</th><th>环比</th></tr></thead><tbody>';
    DATA.forEach(function(d,i){
      var prev = i>0 ? ((d.value-DATA[i-1].value)/DATA[i-1].value*100).toFixed(1)+'%' : '—';
      html += '<tr><td>'+d.month+'</td><td>'+d.value+'</td><td>'+prev+'</td></tr>';
    });
    html += '</tbody></table>';
    box.innerHTML = html;
  }

  function render(){
    if (!window.echarts || window.__chartLibFailed){ renderFallback(); return; }
    chart = echarts.init(document.getElementById('chart'));
    chart.setOption({
      grid:{ left:48, right:16, top:24, bottom:32 },
      tooltip:{ trigger:'axis' },
      xAxis:{ type:'category', data: DATA.map(function(d){ return d.month; }) },
      yAxis:{ type:'value' },
      series:[{ type:'bar', data: DATA.map(function(d){ return d.value; }),
                itemStyle:{ color:'#2563eb', borderRadius:[6,6,0,0] } }]
    });
    // 容器尺寸变化时同步 resize
    if (window.ResizeObserver){
      new ResizeObserver(function(){ chart && chart.resize(); })
        .observe(document.getElementById('chart'));
    } else {
      window.addEventListener('resize', function(){ chart && chart.resize(); });
    }
  }

  window.addEventListener('load', render);
</script>
</body>
</html>
