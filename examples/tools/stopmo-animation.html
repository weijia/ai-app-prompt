<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StopMo</title>
<style>
body{margin:0;background:#0d0d0d;color:#e0e0e0;font-family:sans-serif}
header{padding:10px;background:#1a1a1a;border-bottom:1px solid #333}
#stage{height:50vh;display:flex;align:center;justify-content:center}
#stage img{max-width:100%;max-height:100%}
#strip{display:flex;overflow-x:auto;padding:6px}
.thumb{min-width:72px;height:54px;margin-right:6px;border-radius:4px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.controls{padding:10px;display:flex;gap:8px;flex-wrap:wrap}
button{padding:8px 12px;border-radius:6px;border:1px solid #333;background:#2a2a2a;color:#fff}
</style>
</head>
<body>
<header><h2>StopMo</h2></header>
<div id="stage"><img id="img"></div>
<div id="strip"></div>
<div class="controls">
<button onclick="shoot()">📷 拍摄</button>
<button onclick="play()">▶ 播放</button>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
<script>
let frames=[];
function shoot(){document.getElementById('cam').click()}
document.getElementById('cam').onchange=e=>{
const f=e.target.files[0];
frames.push(URL.createObjectURL(f));
render()
};
function render(){
const s=document.getElementById('strip');
s.innerHTML='';
frames.forEach((u,i)=>{
const d=document.createElement('div');
d.className='thumb';
d.innerHTML='<img src="'+u+'">';
s.appendChild(d)
})
if(frames.length)document.getElementById('img').src=frames[frames.length-1]
}
function play(){
let i=0;
setInterval(()=>{
document.getElementById('img').src=frames[i%frames.length];
i++
},100)
}
</script>
</body>
</html>
